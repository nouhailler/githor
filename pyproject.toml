[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

# ─────────────────────────────────────────────────────────────────────────────
[project]
name = "githor"
version = "0.8.0"
description = "Githor — inventaire, métriques et audit local de repositories GitHub (CLI, lecture seule)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.13"
authors = [
    { name = "Patrick Nouhailler", email = "patrick.nouhailler@gmail.com" },
]
keywords = ["github", "audit", "metrics", "cli", "sqlite", "repository"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Utilities",
]

# La configuration TOML est lue avec `tomllib` (stdlib depuis Python 3.11) :
# aucune dépendance supplémentaire n'est nécessaire pour cela.
dependencies = [
    "httpx>=0.27",
    "typer>=0.12",
    "rich>=13.7",
    "SQLAlchemy>=2.0",
    "pydantic>=2.7",
    "textual>=0.60",
    "Flask>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-httpx>=0.30",  # mock du transport httpx : aucun test ne touche GitHub
    "pytest-asyncio>=0.24",  # pilote App.run_test() de Textual, asynchrone
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.urls]
Homepage = "https://github.com/nouhailler/Githor"
Issues = "https://github.com/nouhailler/Githor/issues"

[project.scripts]
githor = "githor.cli:main"

# ─────────────────────────────────────────────────────────────────────────────
[tool.setuptools.packages.find]
where = ["src"]

# ─────────────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"  # App.run_test() de Textual (tests de la TUI) est asynchrone

# ─────────────────────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # bugbear
    "D",   # pydocstyle : docstrings sur les composants publics
]
ignore = [
    "D107",  # docstring sur __init__ : redondante avec celle de la classe
    "D401",  # « imperative mood » : heuristique anglophone, inapplicable au français
    "D203",  # incompatible avec D211
    "D213",  # incompatible avec D212
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

# ─────────────────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.13"
packages = ["githor"]
mypy_path = "src"
warn_unused_ignores = true
warn_redundant_casts = true
