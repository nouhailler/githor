<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Githor{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="{{ url_for('index') }}">Githor</a>
    <span class="tagline">inventaire, métriques et audit local — lecture seule</span>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <footer class="site-footer">
    <p>Données lues localement depuis la base ; aucune requête réseau, aucune écriture.</p>
  </footer>
  {% block scripts %}{% endblock %}
</body>
</html>
